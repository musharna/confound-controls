[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confound-controls"
version = "0.3.1"
description = "Confound-matched controls for classifier claims: 1:1 matching, bootstrap AUROC, anchored verdicts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["confound_controls"]
